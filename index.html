<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW_OS // TERMINAL_V3</title>
    <style>
        /* --- МОЩНЫЕ СТИЛИ ДИЗАЙНА --- */
        :root {
            --primary: #00ff00;
            --secondary: #003300;
            --bg: #000a00;
            --font: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; cursor: crosshair; }
        body, html {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--primary);
            font-family: var(--font);
            overflow: hidden;
        }

        /* Матрица на заднем плане */
        #matrix-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; opacity: 0.2;
        }

        /* Основной контейнер */
        .main-wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            height: 100vh; padding: 15px;
        }

        /* Помехи как на старом ТВ */
        .scanline {
            width: 100%; height: 100px; z-index: 11;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 0, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1; position: absolute; bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100%; } }

        .terminal-window {
            flex-grow: 1; border: 1px solid var(--primary);
            background: rgba(0, 5, 0, 0.9);
            box-shadow: 0 0 25px var(--secondary);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        .window-header {
            background: var(--primary); color: #000;
            padding: 5px 15px; font-weight: bold;
            display: flex; justify-content: space-between;
            font-size: 0.8em; text-transform: uppercase;
        }

        /* Окно вывода текста */
        #output {
            flex-grow: 1; padding: 20px;
            overflow-y: auto; font-size: 1em;
        }
        #output::-webkit-scrollbar { width: 4px; }
        #output::-webkit-scrollbar-thumb { background: var(--primary); }

        .line { margin-bottom: 10px; line-height: 1.5; }
        .cmd-color { color: #fff; text-shadow: 0 0 8px var(--primary); }
        .sys-info { color: #008800; font-size: 0.9em; }
        .error { color: #ff0000; text-shadow: 0 0 5px #ff0000; }

        /* Строка ввода */
        .input-area {
            display: flex; padding: 15px;
            border-top: 1px solid var(--secondary);
            background: #000;
        }
        .prompt { color: var(--primary); margin-right: 10px; font-weight: bold; }
        #cmd-input {
            background: transparent; border: none; color: var(--primary);
            font-family: var(--font); font-size: 1em; width: 100%;
            outline: none;
        }

        /* Плавающая кнопка связи */
        .btn-tg {
            position: fixed; bottom: 90px; right: 30px;
            border: 2px solid var(--primary);
            background: #000; color: var(--primary);
            padding: 12px 20px; text-decoration: none;
            font-weight: bold; z-index: 100;
            box-shadow: 0 0 15px var(--secondary);
            text-transform: uppercase;
        }
        .btn-tg:hover { background: var(--primary); color: #000; }

        @media (max-width: 600px) {
            #output { font-size: 0.85em; }
            .btn-tg { bottom: 100px; right: 15px; font-size: 0.8em; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="scanline"></div>

<div class="main-wrapper">
    <div class="terminal-window">
        <div class="window-header">
            <span>SHADOW_OS_KERNEL_V3.0</span>
            <span>SECURE_CONNECTION: ACTIVE</span>
        </div>
        
        <div id="output">
            <div class="line" style="color: #fff;">[ СИСТЕМА ИНИЦИАЛИЗИРОВАНА ]</div>
            <div class="line sys-info">> Подгрузка модулей... OK</div>
            <div class="line sys-info">> Проверка прав root... OK</div>
            <div class="line">> Добро пожаловать в Shadow Net. Теперь это твой личный терминал.</div>
            <div class="line">> Введи <span class="cmd-color">'help'</span> для списка доступных команд.</div>
        </div>

        <div class="input-area">
            <span class="prompt">user@shadow:~#</span>
            <input type="text" id="cmd-input" autofocus autocomplete="off">
        </div>
    </div>
</div>

<a href="https://t.me/murzahmedof" class="btn-tg">СВЯЗЬ С АДМИНОМ</a>

<script>
    /* --- ХАКЕРСКАЯ ЛОГИКА --- */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('cmd-input');
    const output = document.getElementById('output');

    // 1. Настройка Матрицы
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 10, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 40);

    // 2. Команды консоли
    const data = {
        'help': 'СПИСОК КОМАНД:<br>[services] - услуги сервиса<br>[status] - инфо о сервере<br>[whoami] - инфо о пользователе<br>[clear] - очистить экран<br>[exit] - выйти',
        'services': '<b style="color:#fff;">НАШИ ВОЗМОЖНОСТИ:</b><br>- Решение ДЗ (страница/задача)<br>- Слив ответов на тесты<br>- Консультации по учебе<br>Для заказа жми на кнопку связи.',
        'status': 'System: <span style="color:#0f0">ONLINE</span><br>Nodes: 12 active<br>Encryption: AES-256<br>Admin: mirsabitaka',
        'whoami': 'User: Anonymous_Student<br>IP: 127.0.0.1 (Masked)<br>Rank: Newbie',
        'exit': 'До свидания, агент...'
    };

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.toLowerCase().trim();
            addBox(`user@shadow:~# ${val}`, 'cmd-color');
            
            if (val === 'clear') {
                output.innerHTML = '';
            } else if (data[val]) {
                addBox(data[val]);
            } else if (val !== '') {
                addBox(`Ошибка: Команда '${val}' не распознана.`, 'error');
            }
            
            input.value = '';
            output.scrollTop = output.scrollHeight;
        }
    });

    function addBox(text, className = '') {
        const div = document.createElement('div');
        div.className = 'line ' + className;
        div.innerHTML = text;
        output.appendChild(div);
    }

    // Всегда держать фокус на вводе
    document.addEventListener('click', () => input.focus());
</script>

</body>
</html>
